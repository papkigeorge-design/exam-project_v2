<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUCCESS COACH - Contact</title>
    <link rel="stylesheet" href="../stylesheets/reset.css">
    <link rel="stylesheet" href="../stylesheets/footer.css">
</head>
<body>
    <footer class="contact">
        <div class="contact-info">
            <hr>
            <h4>Contact</h4>

            <address class="contact-details">
                <p>
                    <span>500 Terry Francine Street,</span>
                    <span>San Francisco, CA 94158</span>
                </p>
                <p>
                    <span>Tel: 123-456-7890</span>
                    <span>Fax: 123-456-7890</span>
                </p>
                <p>
                    <a href="mailto:info@mysite.com">info@mysite.com</a>
                </p>
            </address>

            <ul class="social">
                <li><a href="#"><img src="../image/icons/facebook.svg" alt="Facebook"></a></li>
                <li><a href="#"><img src="../image/icons/twitter.svg" alt="Twitter"></a></li>
                <li><a href="#"><img src="../image/icons/instagram.svg" alt="Instagram"></a></li>
                <li><a href="#"><img src="../image/icons/youtube.svg" alt="YouTube"></a></li>
            </ul>

            <p class="copyright">
                <span>© 2035 by Personal Life Coach.</span>
                <span>Powered and secured by <a href="#">Wix</a></span>
            </p>
        </div>

        <form class="contact-form" action="#" method="post">
            <div class="field1">
                <label for="first-name">First Name *</label>
                <input id="first-name" name="first-name" type="text" autocomplete="given-name" required>
            </div>
            <div class="field2">
                <label for="last-name">Last Name *</label>
                <input id="last-name" name="last-name" type="text" autocomplete="family-name" required>
            </div>
            <div class="field-full1">
                <label for="email">Email *</label>
                <input id="email" name="email" type="email" autocomplete="email" required>
            </div>
            <div class="field field-full2">
                <label for="subject">Subject</label>
                <input id="subject" name="subject" type="text" required>
            </div>
            <div class="field field-full3">
                <label for="message">Message</label>
                <textarea id="message" name="message"></textarea>
            </div>
            <button class="btn submit-btn" type="submit">Submit</button>
        </form>
    </footer>
</body>
</html>
